<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://kit.fontawesome.com/85b090ab76.js" crossorigin="anonymous"></script>
    <title>Background Generator</title>
</head>

<body>
    <header>
        <h1>Backgrond Image Geneartor</h1>
        <p>Generate backgrounds on the fly</p>
    </header>
    <main>
        <!-- Form -->
        <section>
            <div class="input-wrapper">
                <label for="project-title">Project Title</label>
                <input id="project-title" type="text">
            </div>
            <div class="input-wrapper">
                <label for="proejct-description">Project Description</label>
                <input id="proejct-description" type="text">
            </div>
            <div class="input-wrapper">
                <label for="real-name">Real Name</label>
                <input id="real-name" type="text">
            </div>
            <div class="input-wrapper">
                <label for="github-username">GitHub Username</label>
                <input id="github-username" type="text">
            </div>
            <div class="input-wrapper">
                <label for="programming-language">Programming Language</label>
                <select name="programming-language" id="programming-language">
                    <option value="typescript">TypeScript</option>
                    <option value="rust">Rust</option>
                </select>
            </div>
            <div>
                <button type="button" id="preview">Preview</button>
            </div>
        </section>
        <!-- / Form -->
        <!-- Result -->
        <section>
            <div id="preview-container">
                <div id="preview-background-pattern"></div>
                <div id="preview-logo-info-wrapper">
                    <div id="preview-project-logo"></div>
                    <div id="preview-project-title-description-wrapper">
                        <h1 id="preview-project-title">Title</h1>
                        <p id="preview-project-description">Description</p>
                    </div>
                </div>
                <div id="preview-icon-text">
                    <i class="fa-brands fa-github"></i>
                    <p id="preview-user-info">Info</p>
                </div>
            </div>
        </section>
        <!-- / Result -->
        <section>
            <button id="download-cover" disabled>Download</button>
        </section>
    </main>
    <footer></footer>
    <script type="module" src="./js/html-elements.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
